<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MoneyTrack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MoneyTrack</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f5f1;--card:#fff;--text:#1d1d1b;--muted:#66665f;--line:#e2e2da;--brand:#0f6e56;--on-brand:#fff;
--pos:#1b7a3a;--neg:#b3261e;--warn:#7a4f00;--warn-bg:#fdf1d6;--bad-bg:#fcebeb;--ok-bg:#e4f3ea;--chip:#eeeee8;
--sel-bg:#dff0ea;--sel-line:#0f6e56}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1d1d1b;--text:#f0f0ea;--muted:#a4a49c;--line:#33332f;
--pos:#5bd08a;--neg:#ff8f85;--warn:#f0c36b;--warn-bg:#3a2f12;--bad-bg:#3d1c1a;--ok-bg:#16301f;--chip:#2a2a27;
--sel-bg:#12372d;--sel-line:#2fb58f}}
html,body{margin:0;background:var(--bg);color:var(--text);
font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali",sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh}
h1,h2,p{margin:0}
h1{font-size:20px;font-weight:600}
h2{font-size:15px;font-weight:600}
small{color:var(--muted);font-size:13px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
input,select{font:inherit;width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.block{display:block;width:100%}
.btn[disabled]{opacity:.6}
.link{background:none;border:0;color:var(--brand);padding:6px 4px;cursor:pointer;font-size:14px}
@media (prefers-color-scheme:dark){.link{color:#4cc3a0}}
#top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;
padding:max(12px,env(safe-area-inset-top)) 16px 8px}
#top small{display:block;line-height:1.2}
.pill{border:0;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;background:var(--ok-bg);color:var(--pos);cursor:pointer}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--neg)}
#view{padding:4px 16px 110px}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--card);
border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
#nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;cursor:pointer}
#nav button[aria-current=page]{color:var(--brand);font-weight:600}
@media (prefers-color-scheme:dark){#nav button[aria-current=page]{color:#4cc3a0}}
#nav .add span.sq{background:var(--brand);color:#fff;border-radius:12px;width:44px;height:32px;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.hero{background:#0f6e56;color:#fff;border-radius:16px;padding:18px;margin-top:4px}
.hero .lbl{font-size:13px;opacity:.8}
.hero .big{font-size:30px;font-weight:600;line-height:1.2;margin-top:2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.duo>div{background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px}
.duo span{display:block;font-size:12px;opacity:.8}
.duo b{font-size:15px;font-weight:600}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}
.wallets{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.wallets .card{padding:10px 12px}
.wallets small{display:block}
.wallets b{font-size:15px;font-weight:600}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.list{overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer}
.tx:last-child{border-bottom:0}
.txm{flex:1;min-width:0}
.txm b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txm small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txa{text-align:right;font-weight:600;font-size:15px;white-space:nowrap}
.txa small{display:block;font-weight:400}
.bubble{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;
background:hsl(var(--h) 55% 90%);color:hsl(var(--h) 60% 26%)}
@media (prefers-color-scheme:dark){.bubble{background:hsl(var(--h) 30% 24%);color:hsl(var(--h) 70% 82%)}}
.bubble svg.ic{width:18px;height:18px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e0a100;margin-left:6px;vertical-align:middle}
.dot.bad{background:var(--neg)}
.gh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:14px 4px 6px}
.seg{display:flex;gap:6px}
.seg button,.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:42px;padding:6px 12px;cursor:pointer;flex:1}
.seg button[aria-pressed=true],.chip[aria-pressed=true]{background:var(--sel-bg);border-color:var(--sel-line);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;border-radius:20px;min-height:38px;padding:4px 14px;font-size:14px}
.amount{display:flex;align-items:center;gap:8px;margin-top:14px}
.amount span{font-size:28px;font-weight:600;color:var(--muted)}
.amount input{font-size:28px;font-weight:600;min-height:56px}
.err{color:var(--neg);font-size:14px;min-height:21px;margin-top:10px}
.note{font-size:14px;color:var(--muted);margin-top:6px}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;margin:8px 0}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--neg)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.mnav button{background:var(--card);border:1px solid var(--line);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.filters select{padding:6px 8px;font-size:14px;min-height:40px}
.tot{display:flex;gap:16px;font-size:14px;margin:10px 4px 0;color:var(--muted)}
.tot b{color:var(--text)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metrics .card{padding:10px}
.metrics small{display:block}
.metrics b{font-size:15px}
.pie{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pie svg{width:150px;height:150px;flex:none;transform:rotate(0)}
.legend{flex:1;min-width:190px}
.legend div{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:flex;gap:8px}
.bg{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bb{height:110px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.bb i{display:block;width:38%;border-radius:4px 4px 0 0;min-height:2px}
.bi{background:var(--pos)}.be{background:var(--neg)}
.key{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.facts>div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.facts>div:last-child{border-bottom:0}
.facts span:first-child{color:var(--muted)}
.facts span:last-child{text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block}
.row button.rowbtn{background:none;border:0;padding:0;display:flex;width:100%;justify-content:space-between;align-items:center;cursor:pointer;text-align:left}
.empty{text-align:center;padding:36px 16px}
.empty p{color:var(--muted);margin:6px 0 16px}
.lock{max-width:360px;margin:0 auto;padding:12vh 24px 24px;text-align:center}
.lock-ic{width:60px;height:60px;border-radius:50%;background:var(--sel-bg);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.lock-ic svg.ic{width:28px;height:28px}
.lock .sub{color:var(--muted);margin:4px 0 22px}
.pw{position:relative}
.pw input{padding-right:48px}
.pw .eye{position:absolute;right:2px;top:0;height:44px;width:44px;background:none;border:0;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.lock .err{text-align:left}
.lock .hint{font-size:13px;color:var(--muted);margin-top:22px}
h3{font-size:12px;font-weight:600;color:var(--muted);margin:22px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;
font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:20}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
