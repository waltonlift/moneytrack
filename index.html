<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3a31">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MoneyTrack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MoneyTrack</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eef2ef;--sheet:#fff;--fill:#f2f6f3;--ink:#13201c;--ink2:#46554f;--mute:#6b7872;--line:#dde5e0;--hair:rgba(19,32,28,.08);
  --bottle:#0b3a31;--moss:#13594a;--mint:#8de3c3;--brand:#0f6e56;--on-brand:#fff;
  --inc:#1baf7a;--inc-t:#0b7a52;--inc-soft:#bfe9d9;--exp:#eb6834;--exp-t:#b43f16;--exp-soft:#f6c3ac;
  --good:#006300;--bad:#c4302b;--warn:#7a4f00;--warn-bg:#fdf1d6;--bad-bg:#fcebe9;--ok-bg:#e1f3ea;
  --w-cash:#eda100;--w-mfs:#e87ba4;--w-bank:#2a78d6;--w-x:#6250d6;--w-n:#898781;
  --sel-bg:#dcefe8;--sel-line:#0f6e56;--chip:#eef2ef;
  --r-hero:24px;--r-sheet:18px;--r-ctl:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1210;--sheet:#151e1a;--fill:#1b2622;--ink:#eaf1ed;--ink2:#bac8c1;--mute:#8d9b95;--line:#2a3631;--hair:rgba(255,255,255,.08);
  --bottle:#0f4639;--moss:#17695a;--brand:#2fb58f;--on-brand:#06241c;
  --inc:#199e70;--inc-t:#52d9a3;--inc-soft:#1f5d47;--exp:#d95926;--exp-t:#ff9b73;--exp-soft:#6f3721;
  --good:#52d9a3;--bad:#ff8a82;--warn:#f0c36b;--warn-bg:#392e12;--bad-bg:#3d1d1b;--ok-bg:#16301f;
  --w-cash:#c98500;--w-mfs:#d55181;--w-bank:#3987e5;--w-x:#9085e9;--w-n:#898781;
  --sel-bg:#17382f;--sel-line:#2fb58f;--chip:#1b2622}}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali",sans-serif;
  -webkit-text-size-adjust:100%}
body.locked{background:radial-gradient(120% 70% at 85% -10%,#1d6a58 0,rgba(29,106,88,0) 60%),var(--bottle)}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh}
h1,h2,h3,p{margin:0}
h1{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
h2{font-size:16px;font-weight:650;letter-spacing:-.005em}
h3{font-size:14px;font-weight:650;color:var(--ink2);margin:26px 4px 8px}
small{color:var(--mute);font-size:13px}
b{font-weight:650}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
input,select{font:inherit;width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink)}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
label{display:block;font-size:14px;color:var(--ink2);margin:20px 2px 8px;font-weight:500}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r-ctl);padding:10px 16px;min-height:48px;cursor:pointer;font-weight:550}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:650}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{display:block;width:100%}
.btn[disabled]{opacity:.65}
.btn:active{transform:translateY(1px)}
.link{background:none;border:0;color:var(--brand);padding:6px 4px;cursor:pointer;font-size:14px;font-weight:600}
a.link{text-decoration:none}

/* top bar */
#top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:max(14px,env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#top small{display:block;line-height:1.25;margin-top:1px}
.pill{border:0;border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:650;background:var(--ok-bg);color:var(--inc-t);cursor:pointer;white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
#view{padding:2px 16px 118px}

/* bottom navigation */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;align-items:flex-end;
  background:color-mix(in srgb,var(--sheet) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:6}
#nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--mute);padding:6px 0 2px;cursor:pointer;font-weight:500}
#nav button[aria-current=page]{color:var(--brand);font-weight:700}
#nav .add span.sq{background:var(--brand);color:var(--on-brand);border-radius:16px;width:54px;height:40px;display:flex;align-items:center;justify-content:center;margin-top:-14px;
  box-shadow:0 0 0 5px var(--bg)}
#nav .add{color:var(--ink2)}

/* sheets: one white surface per section, rows inside divided by hairlines */
.sheet{background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r-sheet);overflow:hidden}
.sheet.pad{padding:16px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px;gap:12px}
.sec-h small{font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block}
.row .rowbtn{background:none;border:0;padding:0;display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;text-align:left;text-decoration:none;color:inherit}
.row .lead{display:flex;align-items:center;gap:12px;min-width:0}
.row .lead svg{color:var(--mute)}
.row.stack{display:block}

/* hero: the balance, and where the money sits */
.hero{background:radial-gradient(90% 120% at 100% 0,var(--moss) 0,rgba(19,89,74,0) 62%),var(--bottle);color:#fff;border-radius:var(--r-hero);padding:20px 20px 18px;margin-top:4px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero .lbl{font-size:14px;color:rgba(255,255,255,.78)}
.hero .eye{background:rgba(255,255,255,.12);border:0;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.hero .eye svg{width:18px;height:18px}
.hero .big{font-size:38px;font-weight:750;letter-spacing:-.03em;line-height:1.15;margin:4px 0 2px}
.hero .month{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:rgba(255,255,255,.78)}
.hero .month b{color:#fff;font-weight:650}
.hero .month .in b{color:var(--mint)}
.spine{display:flex;gap:3px;height:12px;margin:20px 0 10px}
.spine i{display:block;border-radius:6px;min-width:6px;transform-origin:left center}
.spine.enter i{animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.spine.empty{background:rgba(255,255,255,.14);border-radius:6px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.skey{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,.82)}
.skey span{display:inline-flex;align-items:center;gap:6px}
.skey i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* quick add */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.quick button{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r-ctl);min-height:48px;cursor:pointer;font-weight:600;font-size:14.5px}
.quick svg{width:18px;height:18px}
.quick .q-exp svg{color:var(--exp-t)}.quick .q-inc svg{color:var(--inc-t)}.quick .q-tr svg{color:var(--w-bank)}

/* wallets */
.wrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;cursor:pointer;text-align:left}
.wrow:last-child{border-bottom:0}
.wdot{width:12px;height:12px;border-radius:50%;flex:none}
.wn{flex:1;font-weight:550}
.wshare{color:var(--mute);font-size:13px}
.wb{min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}.pos{color:var(--inc-t)}.exp{color:var(--exp-t)}

/* seven day strip */
.spark{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;align-items:end}
.sp{display:flex;flex-direction:column;align-items:center;gap:6px}
.sp .bar{height:64px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.sp .bar i{display:block;width:100%;max-width:24px;border-radius:4px 4px 0 0;background:var(--exp);min-height:2px}
.sp .bar i.z{background:var(--line)}
.sp small{font-size:12px}
.sp.today small{color:var(--ink);font-weight:700}

/* transactions */
.list{overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;cursor:pointer}
.tx:last-child{border-bottom:0}
.tx:active{background:var(--fill)}
.txm{flex:1;min-width:0}
.txm b{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txm small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txa{text-align:right;font-weight:650;font-size:15.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.txa small{display:block;font-weight:400}
.bubble{width:40px;height:40px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:650;font-size:18px;
  background:hsl(var(--h) 55% 91%);color:hsl(var(--h) 60% 26%)}
@media (prefers-color-scheme:dark){.bubble{background:hsl(var(--h) 28% 22%);color:hsl(var(--h) 70% 84%)}}
.bubble svg.ic{width:19px;height:19px}
.bubble.sm{width:34px;height:34px;border-radius:11px;font-size:16px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e0a100;margin-left:8px;vertical-align:middle}
.dot.bad{background:var(--bad)}
.gh{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);padding:18px 6px 8px;font-variant-numeric:tabular-nums}

/* forms */
.seg{display:flex;gap:6px;background:var(--fill);border-radius:16px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:12px;min-height:44px;padding:6px 10px;cursor:pointer;font-weight:550;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--sheet);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.06)}
.seg.t-expense button[aria-pressed=true]{color:var(--exp-t)}
.seg.t-income button[aria-pressed=true]{color:var(--inc-t)}
.seg.t-transfer button[aria-pressed=true]{color:var(--w-bank)}
.seg.plain{background:none;padding:0;gap:6px}
.seg.plain button{border:1px solid var(--line);background:var(--sheet)}
.seg.plain button[aria-pressed=true]{background:var(--sel-bg);border-color:var(--sel-line);box-shadow:none;color:var(--ink)}
.amount{display:flex;align-items:center;gap:8px;margin-top:22px;padding:6px 14px;border-radius:18px;background:var(--sheet);border:1px solid var(--hair)}
.amount span{font-size:32px;font-weight:650;color:var(--mute)}
.amount input{font-size:34px;font-weight:700;min-height:62px;border:0;background:none;padding:0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.amount input:focus{outline:none}
.amount:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.amount.t-expense span{color:var(--exp-t)}.amount.t-income span{color:var(--inc-t)}.amount.t-transfer span{color:var(--w-bank)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:22px;min-height:42px;padding:6px 14px;cursor:pointer;font-size:14.5px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed=true]{background:var(--sel-bg);border-color:var(--sel-line);font-weight:650}
.chip .e{font-size:16px;line-height:1}
.chip .wdot{width:10px;height:10px}
.err{color:var(--bad);font-size:14px;min-height:21px;margin-top:12px}
.note{font-size:14px;color:var(--mute);margin-top:8px}
.banner{border-radius:14px;padding:12px 14px;font-size:14px;margin:8px 0;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner svg{width:18px;height:18px;margin-top:2px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--fill);color:var(--ink2)}
.banner .link{color:inherit;text-decoration:underline;padding:0}
.datechips{display:flex;gap:8px;margin-top:8px}
.datechips .chip{flex:none}

/* history */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.mnav button{background:var(--sheet);border:1px solid var(--hair);border-radius:12px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mnav b{font-size:17px}
.mnav button[disabled]{opacity:.35}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 8px}
.filters select{padding:6px 8px;font-size:14px;min-height:42px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr)}
.stats3>div{padding:14px 14px}
.stats3>div+div{border-left:1px solid var(--line)}
.stats3 small{display:block}
.stats3 b{font-size:17px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;display:block;margin-top:2px;overflow-wrap:anywhere}
.empty{text-align:center;padding:40px 16px}
.empty p{color:var(--mute);margin:6px 0 18px}

/* reports */
.rseg{margin-bottom:12px}
.dl{font-size:12.5px;font-weight:650;white-space:nowrap}
.dl.good{color:var(--good)}.dl.bad{color:var(--bad)}.dl.flat{color:var(--mute)}
.cap{font-size:13px;color:var(--mute);margin:10px 4px 0}
.meter{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--fill);margin:12px 0 10px}
.meter i{display:block;height:100%}
.meter .m-exp{background:var(--exp)}.meter .m-keep{background:var(--inc)}
.mkey{display:flex;gap:16px;font-size:13.5px;color:var(--ink2);flex-wrap:wrap}
.mkey span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw.exp{background:var(--exp)}.sw.inc{background:var(--inc)}
.lead-text{font-size:15px;line-height:1.45}
.readout{font-size:14px;line-height:1.45;color:var(--ink2);margin:0 0 16px;min-height:42px}
.readout b{color:var(--ink)}
.chart{position:relative}
.plot{position:relative;height:150px;border-bottom:1px solid var(--line);margin:0 0 0 0}
.plot .gl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line);pointer-events:none}
.plot .gl span{position:absolute;left:0;top:-17px;font-size:11.5px;color:var(--mute);background:var(--sheet);padding-right:6px}
.plot .gl.avg{border-top-color:var(--mute)}
.plot .gl.avg span{left:auto;right:0;padding:0 0 0 6px;top:-17px}
.cols{position:absolute;inset:0;display:flex;gap:2px;align-items:stretch}
.col{flex:1;min-width:0;background:none;border:0;padding:0;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;position:relative;border-radius:6px 6px 0 0}
.col i{display:block;width:100%;max-width:24px;border-radius:4px 4px 0 0;background:var(--exp);min-height:0}
.col.fut i{background:var(--line)}
.col[aria-pressed=true]{background:var(--fill)}
.col:not([aria-pressed=true]) i.dim{opacity:.55}
.col.g{gap:3px}
.col.g i{width:38%;max-width:18px}
.col.g .bi{background:var(--inc)}.col.g .be{background:var(--exp)}
.col.wk i{background:var(--exp-soft)}
.col.wk.top i{background:var(--exp)}
.chart.gutter .plot,.chart.gutter .xaxis,.chart.gutter .xlabels{margin-right:46px}
.chart.gutter .plot .gl span{left:100%;right:auto;top:-9px;background:none;padding:0 0 0 6px;white-space:nowrap}
.chart.gutter .plot .gl.avg span{left:100%;right:auto;top:-9px;padding:0 0 0 6px}
.xaxis{position:relative;height:20px;margin-top:6px}
.xaxis span{position:absolute;transform:translateX(-50%);font-size:12px;color:var(--mute);white-space:nowrap}
.xlabels{display:flex;gap:2px;margin-top:6px}
.xlabels span{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.xlabels span.on{color:var(--ink);font-weight:700}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tbl{margin-top:14px;font-size:13.5px}
.tbl summary{cursor:pointer;color:var(--brand);font-weight:600;padding:4px 0}
.tbl table{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--mute);font-weight:550}
.crow{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.cmid{flex:1;min-width:0}
.cl{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.cl b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.cbar{height:8px;border-radius:4px;background:var(--fill);margin:8px 0 6px;overflow:hidden}
.cbar i{display:block;height:100%;border-radius:4px;background:var(--exp);min-width:3px}
.cbar.inc i{background:var(--inc)}
.csub{font-size:13px;color:var(--mute);display:flex;gap:6px 10px;flex-wrap:wrap}
.wtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.wtable th{font-weight:550;color:var(--mute);font-size:12.5px;text-align:right;padding:12px 10px 6px}
.wtable td{padding:11px 10px;text-align:right;border-top:1px solid var(--line)}
.wtable th:first-child,.wtable td:first-child{text-align:left;padding-left:16px}
.wtable th:last-child,.wtable td:last-child{padding-right:16px}
.wtable td:first-child{font-weight:600;white-space:nowrap}
.wtable td:first-child .wdot{display:inline-block;margin-right:8px;vertical-align:baseline}
.facts>div{display:flex;justify-content:space-between;gap:16px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px}
.facts>div:last-child{border-bottom:0}
.facts span:first-child{color:var(--ink2)}
.facts span:last-child{text-align:right;font-weight:600}
.facts small{display:block;font-weight:400}

/* lock screen */
.lock{max-width:380px;margin:0 auto;padding:max(12vh,48px) 26px 28px;text-align:center;color:#fff}
.lock .logo{width:68px;height:68px;border-radius:20px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.lock .logo svg{width:36px;height:36px}
.lock h1{font-size:26px;color:#fff}
.lock .sub{color:rgba(255,255,255,.78);margin:6px 0 26px}
.lock .pw input{background:rgba(255,255,255,.96);color:#13201c;border-color:transparent;min-height:50px}
.lock .pw .eye{color:#5d6b66}
.lock .err{text-align:left;color:#ffb4ab}
.lock .btn.primary{background:var(--mint);border-color:var(--mint);color:#06241c;min-height:52px;font-size:16px}
.lock .hint{font-size:13.5px;color:rgba(255,255,255,.7);margin-top:20px;min-height:20px}
.lock .link{color:var(--mint)}
.lock .banner.warn{background:rgba(255,255,255,.1);color:#fff;text-align:left}
.lock .btn.danger{background:none;color:#ffb4ab;border-color:#ffb4ab}
.pw{position:relative}
.pw input{padding-right:50px}
.pw .eye{position:absolute;right:2px;top:0;height:46px;width:46px;background:none;border:0;color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center}

#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(6px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;
  font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%;text-align:center;z-index:20}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.spine.enter i{animation:none}#toast{transition:none}.btn:active{transform:none}}
@media (min-width:700px){#view{padding-bottom:130px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
